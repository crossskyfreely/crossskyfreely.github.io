<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>密码保护页面</title>
    <style>
        /* 隐藏需要密码保护的内容 */
        #protected-content {
            display: none;
        }
        /* 美化密码输入区域 */
        #password-section {
            margin-top: 50px;
            text-align: center;
        }
        #error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 公开区域（所有人都能看到） -->
    <h1>欢迎来到我的网站</h1>
    <p>这是公开内容，不需要密码。</p>

    <!-- 密码输入区域（始终显示） -->
    <div id="password-section">
        <input type="password" id="password-input" placeholder="请输入访问密码">
        <button onclick="verifyPassword()">解锁内容</button>
        <div id="error-msg"></div>
    </div>

    <!-- 受保护的内容（初始隐藏） -->
    <div id="protected-content">
        <h2>🎉 这里是隐藏的精彩内容</h2>
        <p>只有知道密码的人才能看到。</p>
    </div>

    <script>
        // 设置你的密码（注意：这个在源码里是明文可见的！）
        const CORRECT_PASSWORD = '2026';

        function verifyPassword() {
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-msg');
            const protectedContent = document.getElementById('protected-content');
            const passwordSection = document.getElementById('password-section');

            if (input.value === CORRECT_PASSWORD) {
                // 密码正确：显示隐藏内容，隐藏输入区
                protectedContent.style.display = 'block';
                passwordSection.style.display = 'none';
                errorMsg.textContent = ''; // 清空错误信息
            } else {
                // 密码错误：提示并清空输入框
                errorMsg.textContent = '❌ 密码错误，请重试';
                input.value = '';
                input.focus();
            }
        }

        // 额外优化：按回车键也可以触发验证
        document.getElementById('password-input').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        });
    </script>
</body>
</html>
